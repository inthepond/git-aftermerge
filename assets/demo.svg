<text x="208" y="233" text-anchor="middle" fill="#909090" font-size="10">−38</text>

<line x1="32" y1="250" x2="242" y2="250" stroke="#1a1a1a" stroke-width="1"/>

<text x="32" y="269" fill="#707070" font-size="9">merged</text>
<text x="96" y="269" fill="#909090" font-size="9">2026-03-15</text>

<text x="32" y="288" fill="#707070" font-size="9">branch</text>
<text x="96" y="288" fill="#909090" font-size="9">feat/jwt-rotation</text>

<line x1="32" y1="304" x2="242" y2="304" stroke="#1a1a1a" stroke-width="1"/>

<text x="32" y="320" fill="#707070" font-size="9">files changed</text>
<text x="242" y="320" text-anchor="end" fill="#909090" font-size="9">src/auth.py</text>
<text x="242" y="334" text-anchor="end" fill="#909090" font-size="9">src/token.py</text>


