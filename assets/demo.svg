<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
<defs>
  <style>
    text { font-family: ui-monospace, 'SF Mono', Menlo, monospace; }

    @keyframes scan {
      0%,4%  { transform: translateX(0);     opacity: 0; }
      7%     { transform: translateX(0);     opacity: 1; }
      73%    { transform: translateX(272px); opacity: 1; }
      79%    { transform: translateX(272px); opacity: 0; }
      100%   { transform: translateX(0);     opacity: 0; }
    }
    .scan-line { animation: scan 10s ease-in-out infinite; }
  </style>

  <!-- Reverted diagonal stripe pattern -->
  <pattern id="rev" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="6" height="6" fill="#141414"/>
    <rect width="2.5" height="6" fill="#252525"/>
  </pattern>

  <!-- Arrow -->
  <marker id="aw" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
    <path d="M0,0.5 L0,5.5 L5.5,3z" fill="#707070"/>
  </marker>

  <!-- Clip: keep bars inside timeline x-range -->
  <clipPath id="tc">
    <rect x="300" y="130" width="274" height="250"/>
  </clipPath>

  <!-- Glow for scan dot -->
  <filter id="g" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>


<!-- ═══ BACKGROUND ═══ -->
<rect width="900" height="500" rx="10" fill="#080808"/>
<rect width="900" height="500" rx="10" fill="none" stroke="#1c1c1c" stroke-width="1.5"/>

<!-- Header strip -->
<rect x="1" y="1" width="898" height="51" rx="9" fill="#0d0d0d"/>
<line x1="0" y1="52" x2="900" y2="52" stroke="#1c1c1c" stroke-width="1"/>

<!-- Footer strip -->
<line x1="0" y1="442" x2="900" y2="442" stroke="#1c1c1c" stroke-width="1"/>
<rect x="1" y="442" width="898" height="57" rx="0" fill="#0d0d0d"/>

<!-- Panel dividers -->
<line x1="272" y1="52" x2="272" y2="442" stroke="#161616" stroke-width="1"/>
<line x1="592" y1="52" x2="592" y2="442" stroke="#161616" stroke-width="1"/>


<!-- ════════════════════════════════════════
     HEADER
     ════════════════════════════════════════ -->
<text x="450" y="29" text-anchor="middle" fill="#e8e8e8" font-size="16" font-weight="700" letter-spacing="0.5">git-aftermerge</text>
<text x="450" y="44" text-anchor="middle" fill="#686868" font-size="10">Track the downstream fate of every commit · Post-merge feedback for AI agents</text>


