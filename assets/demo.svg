<text x="136" y="72" text-anchor="middle" fill="#686868" font-size="9" font-weight="600" letter-spacing="2">① COMMIT MERGED</text>

<!-- Commit card -->
<rect x="18" y="82" width="238" height="274" rx="6" fill="#0f0f0f" stroke="#1e1e1e" stroke-width="1"/>

