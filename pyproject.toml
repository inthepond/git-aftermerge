[project]
name = "git-aftermerge"
version = "0.1.0"
description = "Track the downstream fate of every commit. Post-merge feedback for AI coding agents."
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = [
    "gitpython>=3.1.40",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]

[project.scripts]
git-aftermerge = "git_aftermerge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/git_aftermerge"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
